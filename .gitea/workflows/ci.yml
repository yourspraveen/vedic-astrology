# Quality gate — runs on Gitea Actions (GitHub-Actions-compatible syntax).
#
# Runs on the host runner (not a `container:`), because actions/checkout needs Node, which a bare
# `rust` image lacks. Rust is installed per run via rustup. No Docker-in-Docker is assumed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quality gate (clippy, tests, structure)
        run: |
          set -e
          # Rust toolchain (with clippy) and a C compiler for the vendored Swiss Ephemeris.
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy
          fi
          . "$HOME/.cargo/env"
          rustup component add clippy >/dev/null 2>&1 || true
          command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends gcc) || (sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc)
          ./scripts/check.sh
